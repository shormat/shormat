  <line class="fade d1" x1="218" y1="82" x2="262" y2="82" stroke="#7d8590" stroke-width="1"/>
  <text class="fade d2" x="240" y="108" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" letter-spacing="4" fill="#7d8590">DÉVELOPPEUR</text>
</svg>
