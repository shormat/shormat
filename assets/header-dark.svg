    @keyframes fade { to { opacity: 1; } }
  </style>
  <text class="fade" x="400" y="110" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="68"
        letter-spacing="3" fill="#e6edf3">shormat</text>
  <line class="fade d1" x1="370" y1="140" x2="430" y2="140" stroke="#7d8590" stroke-width="1"/>
  <text class="fade d2" x="400" y="172" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" letter-spacing="5" fill="#7d8590">DÉVELOPPEUR</text>
</svg>
